name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check src tests

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -m "not tshark" -q

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install TShark
        run: |
          echo "wireshark-common wireshark-common/install-setuid boolean false" | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
          tshark --version | head -1
      - name: Diagnose TShark access
        run: |
          ls -l data/traces/raw
          tshark -r data/traces/raw/arp-icmp.pcapng -c 1 || true
          cp data/traces/raw/arp-icmp.pcapng "$RUNNER_TEMP/probe.pcapng"
          tshark -r "$RUNNER_TEMP/probe.pcapng" -c 1 || true
          sudo aa-status 2>/dev/null | grep -i -E "tshark|wireshark|dumpcap" || echo "no AppArmor profile for tshark"
      - run: uv sync --locked
      - run: uv run pytest -m tshark -q
