[project]
name = "llms-understand-network-traces"
version = "0.1.0"
description = "Reproducible benchmark for evaluating LLMs on question answering over network traffic traces."
readme = "README.md"
authors = [
    { name = "Irene Gosálvez-White", email = "irenegwh@ugr.es" },
    { name = "Carlota de la Vega-Soriano", email = "carlotadelavega@ugr.es" },
    { name = "Roberto Magán-Carrión", email = "rmagan@ugr.es" },
    { name = "Pedro García-Teodoro", email = "pgteodor@ugr.es" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "huggingface-hub>=2.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "ollama>=0.6.3",
    "pyshark>=0.6",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["tshark: needs the TShark binary (run in the integration job)"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401", "F811", "F841"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

